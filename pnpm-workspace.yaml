packages:
  - packages/*
  - apps/*
overrides:
  # GHSA-mh99-v99m-4gvg: unbounded brace expansion crashes the process (DoS).
  # Scoped to the 5.x line, which is the only one the advisory affects and the
  # only one that resolves here (eslint's minimatch@10). Dev-only, never shipped.
  brace-expansion@5: '>=5.0.8'
#
# No `auditConfig.ignoreGhsas`. The single entry that lived here suppressed
# GHSA-mh99-v99m-4gvg for one unfixable copy reached through
# apps/docs > @docusaurus/core > serve-handler > minimatch@3 > brace-expansion@1.
# The Starlight migration removed @docusaurus/core, so that path no longer
# exists — `pnpm why minimatch` now shows only 10.2.5 — and the suppression was
# covering nothing while still being able to hide a future advisory. The
# `serialize-javascript` and `uuid` overrides went with it: both existed for
# Docusaurus's webpack plugins and its sockjs dev server, and neither package
# resolves in the tree at all any more.
allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.4'
  # Reviewed dependency upgrades requested before the 24-hour quarantine ends.
  # Exact pins keep the exception from applying to later releases.
  - lint-staged@17.2.0
  - tsdown@0.22.14
  - verkit@0.3.0
  - '@rxova/brand'
