name: Docs

# Docs are published as part of rxova.org (the rxova/rxova-website aggregator),
# not from this repo. On push to main we build the docs to catch breakage, then
# notify the aggregator to rebuild rxova.org/packages/react-inputs.
# Requires secret AGGREGATOR_DISPATCH_TOKEN (fine-grained PAT with Contents:
# write on rxova/rxova-website).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialised rather than cancelled: two quick merges to main would otherwise
# race, and the aggregator would be dispatched twice for builds that finished
# out of order. cancel-in-progress: false because the dispatch is the point —
# killing a run mid-flight can drop the notification entirely.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # `docs:build` is a Turbo task: it builds the component packages first
      # (the docs import them for live examples), then runs the Astro/Starlight
      # build, which regenerates the TypeDoc API reference from source via
      # starlight-typedoc.
      - run: pnpm run docs:build

  notify-website:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rxova.org rebuild
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
          repository: rxova/rxova-website
          event-type: docs-react-inputs
          client-payload: '{"ref": "${{ github.sha }}"}'
