name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` are added on top of the defaults (opened,
    # synchronize, reopened) so that adding the `skip-changeset` label to an
    # already-opened PR re-runs the `changeset` gate instead of leaving its
    # earlier failure stuck red until the next push.
    #
    # `edited`: retitling a PR must re-check it, because the title becomes the
    # squash-merge commit message and nothing else validates it.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# Default to read-only; jobs opt into more where they need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The root of the graph: everything else declares `needs: [commitlint]`.
  # Replaces the standalone Commitlint workflow, which billed a full minute of
  # its own and gated nothing — a bad message failed a check that no other job
  # depended on.
  #
  # It runs on push as well as pull_request on purpose. A job that is skipped
  # also skips its dependents, so gating this on `pull_request` alone would
  # silently skip the entire workflow on main — and the alternative, an
  # `if: always() && !failure()` on every other job, is the kind of expression
  # that is wrong in a way nobody notices until something ships unchecked.
  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint the branch commits
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # The squash-merge subject is the PR *title*, which no commit in the
      # branch contains and which `edited` lets someone change after CI already
      # went green. The old wagoid action linted commits only, so the one
      # message that actually lands on main was the one nothing checked.
      # Passed through the environment, never interpolated into the shell — a
      # title is attacker-controlled text.
      - name: Lint the PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose

      # On main this is the squashed subject already linted above, plus the
      # changesets `chore: version packages` commit. Cheap, and it is what keeps
      # this job unskippable.
      - name: Lint the pushed commit
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

  # The component list, read from the packages that declare themselves rather
  # than repeated in every matrix below. A new input used to need an edit in two
  # places here, and forgetting either was silent: the job simply never ran for
  # that package and CI stayed green.
  #
  # No pnpm install — component-packages.mjs is dependency-free by design, so
  # this is a checkout and a node call.
  discover:
    name: discover packages
    needs: [commitlint]
    runs-on: ubuntu-latest
    outputs:
      # JSON array for `matrix`, space-separated for shell loops. Same source.
      dirs: ${{ steps.list.outputs.dirs }}
      dirs_list: ${{ steps.list.outputs.dirs_list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          node packages/utils/print-component-packages.mjs | tee -a "$GITHUB_OUTPUT"

  checks:
    name: lint · format · types · docs
    needs: [commitlint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      # Type-checks every fenced snippet in the root README and each package
      # README, so a copy-pasteable example cannot rot into something that does
      # not parse. Invoked through Turbo (a `//#check:docs` root task) so it
      # replays from cache when no README changed.
      - run: pnpm exec turbo run check:docs
      - run: pnpm run lint
      - run: pnpm run typecheck

  supply-chain:
    name: audit · dedupe
    needs: [commitlint]
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # Both are in the local pre-push gate too (packages/utils/verify.mjs).
      # Running them here as well is what keeps a stale local checkout from
      # being the only thing between a new advisory and a release.
      #
      # `audit:check` is deliberately not a Turbo task: its verdict depends on
      # the upstream advisory database, which changes without any file here
      # changing, so a cached pass could replay over a fresh CVE.
      - run: pnpm run audit:check
      - run: pnpm run dedupe:check

  pack-smoke:
    name: package contract
    needs: [commitlint]
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:browsers
      - run: pnpm run build
      # publint and attw read the manifest; pack:smoke installs the real
      # tarballs and imports them through both module systems.
      - run: pnpm run check:exports
      - run: pnpm run pack:smoke
      - run: pnpm run size

  test:
    name: unit (node ${{ matrix.node }})
    needs: [commitlint, discover]
    # The changesets version PR only edits version numbers and changelogs, so
    # the source-level suites add no signal on it.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor here must match `engines.node` in the packages. Claiming a
        # version we never run is worse than not claiming it.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      # Install always runs on a pnpm-compatible Node: pnpm 11 declares
      # `engines.node >= 22.13` and imports `node:sqlite`, so installing under
      # Node 20 crashes before a single test executes. That is a constraint of
      # our package manager, not of the libraries, and it must not silently
      # shrink the support matrix.
      #
      # Deliberately no turbo-cache: Turbo hashes files and env, not the Node
      # binary, and the cache action keys on `github.job` — the same string for
      # every leg. Both legs would share one cache, so node 24 could replay a
      # result computed under node 20.
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      # Then switch to the Node under test and invoke each package's Vitest
      # binary directly, bypassing pnpm (which would crash on Node 20). Vitest
      # itself supports ^20 || ^22 || >=24.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Confirm the Node under test
        run: node --version
      - name: Unit suites (pure logic, no DOM)
        run: |
          set -e
          for dir in ${{ needs.discover.outputs.dirs_list }}; do
            echo "::group::$dir (unit)"
            (cd "packages/$dir" && ./node_modules/.bin/vitest run --project unit)
            echo "::endgroup::"
          done
          echo "::group::codemod"
          (cd packages/codemod && ./node_modules/.bin/vitest run)
          echo "::endgroup::"

  browser:
    name: browser + coverage
    needs: [commitlint]
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile

      # The browser binary is the slow part and only changes when Playwright
      # does, so the cache key is the resolved version.
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      # Enforces 95% per file. A new file with thin tests fails here even when
      # a package's average would still pass.
      - run: pnpm run test:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: packages/*/coverage
          if-no-files-found: ignore

  react-minimum:
    name: react 18 (${{ matrix.pkg }})
    needs: [commitlint, discover]
    # The peer range allows React 18, but the lockfile only ever installs 19, so
    # without this the minimum supported version is an untested claim. Separate
    # from the matrix because it rewrites the React version, which
    # --frozen-lockfile forbids. One job per package so the pinned React does
    # not race across the workspace.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Install the minimum supported React and re-run
        run: pnpm --filter @rxova/${{ matrix.pkg }} test:react-min

  e2e:
    name: e2e
    needs: [commitlint]
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-playwright

      # `turbo run e2e` builds each package's demo (the cached `demo:build`
      # task) and runs its Playwright suite against its own preview port. The
      # packages run concurrently; unchanged suites replay from the
      # `.turbo` cache restored above.
      - run: pnpm run e2e
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/*/playwright-report
            packages/*/test-results
          if-no-files-found: ignore

  changeset:
    name: changeset present
    needs: [commitlint]
    # Skip the auto-generated version PR: it has already consumed every
    # changeset, so the gate would find none and fail.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    permissions:
      contents: read
      # check-changeset.ts reads the skip-changeset label through the API
      # (`gh api repos/.../labels`). Without this the call 403s, the script
      # warns and proceeds label-blind, and the documented escape hatch
      # silently does nothing.
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      # Escape hatches: the `skip-changeset` label, or `[skip-changeset]` in the
      # PR title. Docs/CI/config-only diffs are auto-skipped by the script,
      # which also validates one package per changeset file — neither of which
      # `changeset status --since` could do.
      - name: Require a changeset for published-package changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --import tsx ./packages/utils/check-changeset.ts
