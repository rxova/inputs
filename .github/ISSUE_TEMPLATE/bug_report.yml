name: 'Bug report'
description: 'Report a reproducible problem in react-intl-currency-input.'
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fields below are the axes this component actually
        varies on — filling them in usually identifies the cause immediately.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 'react-intl-currency-input@x.y.z'
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: '19.2.0'
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where does it happen?
      options:
        - Browser (client render)
        - SSR / hydration
        - React Server Components
        - A test environment (jsdom, happy-dom, ...)
        - Build or type-checking
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How is it used?
      options:
        - Controlled (value + onChange)
        - Uncontrolled (defaultValue)
        - Inside a form library
        - The useCurrencyInput hook directly
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: locale / currency
      description: 'The pair in use. Most formatting differences trace back to this — please include it.'
      placeholder: "locale='bg-BG' currency='EUR'"
    validations:
      required: true
  - type: input
    id: value
    attributes:
      label: The amount involved
      description: 'The numeric value and, if relevant, what the field displayed vs. what you expected.'
      placeholder: '50000 → showed "50000 €", expected "50 000 €"'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: 'A minimal snippet, or a link to a StackBlitz/CodeSandbox. `pnpm dev` in this repo runs a playground you can adapt.'
      render: tsx
    validations:
      required: true
  - type: checkboxes
    id: rtl
    attributes:
      label: Anything else applicable?
      options:
        - label: 'The page is right-to-left'
        - label: 'The user prefers reduced motion'
        - label: 'A strict Content Security Policy is in effect'
        - label: 'Custom `--rfs-*` CSS variables are set'
